<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Grid Tracker - Excel-Style DSA Preparation Board</title>
  <meta name="description" content="An interactive, Excel-like sheet to organize, manage, and track your Data Structures & Algorithms (DSA) preparation progress by topic and phase.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar: Left Navigation for Topics -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">
        <!-- SVG Grid Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
        </svg>
      </div>
      <h1 class="logo-text">DSA Grid</h1>
    </div>
    
    <div class="sidebar-menu">
      <span class="menu-label">Topics</span>
      <nav id="topics-list" aria-label="DSA Topics Navigation">
        <!-- Topics dynamically loaded here -->
      </nav>
      
      <button id="btn-add-topic" class="add-topic-btn" type="button" aria-label="Add a new DSA topic">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Topic
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <!-- Top Header -->
    <header class="header">
      <div class="header-title-container">
        <h2 id="active-topic-title" class="header-title">Loading Topic...</h2>
        <span id="active-topic-subtitle" class="header-subtitle">Topic Overview</span>
      </div>
      
      <div class="header-actions">
        <!-- Overall Progress Tracker -->
        <div class="stats-strip" id="overall-stats" aria-label="Preparation Progress Stats">
          <div class="stat-item">
            <span id="stat-solved-ratio" class="stat-val">0/0</span>
            <span class="stat-lbl">Solved</span>
          </div>
          <div class="stat-item">
            <span id="stat-percent" class="stat-val">0%</span>
            <span class="stat-lbl">Progress</span>
          </div>
        </div>

        <!-- Import / Export Actions -->
        <button id="btn-export-data" class="btn btn-secondary" title="Export progress as JSON" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export
        </button>
        <button id="btn-import-data" class="btn btn-secondary" title="Import backup JSON" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Import
        </button>
        <input type="file" id="import-file-input" class="hidden-file-input" accept=".json">
      </div>
    </header>

    <!-- Sheet/Grid View -->
    <div class="dashboard-view">
      
      <!-- Filters and Search Bar -->
      <section class="filters-bar" aria-label="Filters and Search">
        <div class="search-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search questions in this topic...">
        </div>
        
        <div class="filter-pills" role="tablist">
          <button class="filter-pill active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-pill" data-filter="unsolved" role="tab" aria-selected="false">Unsolved</button>
          <button class="filter-pill" data-filter="solved" role="tab" aria-selected="false">Solved</button>
          <button class="filter-pill" data-filter="easy" role="tab" aria-selected="false">Easy</button>
          <button class="filter-pill" data-filter="medium" role="tab" aria-selected="false">Medium</button>
          <button class="filter-pill" data-filter="hard" role="tab" aria-selected="false">Hard</button>
        </div>
      </section>

      <!-- Dynamic sheet segments (Phases inside Active Topic) -->
      <section id="phases-container" class="flex flex-col gap-3" aria-label="DSA Phase sheets">
        <!-- Phases will be loaded dynamically by app.js -->
      </section>

    </div>
  </main>

  <!-- ================= MODALS & DRAWERS ================= -->

  <!-- Modal: Add Topic -->
  <div id="modal-add-topic" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Create New Topic</h3>
        <button class="modal-close" id="close-modal-topic" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="form-add-topic">
        <div class="form-group">
          <label for="input-topic-name" class="form-label">Topic Name</label>
          <input type="text" id="input-topic-name" class="form-control" placeholder="e.g. Arrays, Strings, Trees" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-topic">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Topic</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add Phase -->
  <div id="modal-add-phase" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Create New Phase</h3>
        <button class="modal-close" id="close-modal-phase" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="form-add-phase">
        <div class="form-group">
          <label for="input-phase-name" class="form-label">Phase Name</label>
          <input type="text" id="input-phase-name" class="form-control" placeholder="e.g. Phase 1: Basics, Phase 2: Core Patterns" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-phase">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Phase</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add/Edit Question -->
  <div id="modal-question" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="question-modal-title">Add New Question</h3>
        <button class="modal-close" id="close-modal-question" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="form-question">
        <!-- Hidden input to track if we're editing -->
        <input type="hidden" id="input-question-id">
        <input type="hidden" id="input-question-phase-id">
        
        <div class="form-group">
          <label for="input-question-title" class="form-label">Question Title</label>
          <input type="text" id="input-question-title" class="form-control" placeholder="e.g. Two Sum" required>
        </div>
        
        <div class="form-group">
          <label for="input-question-link" class="form-label">Platform URL / Link</label>
          <input type="url" id="input-question-link" class="form-control" placeholder="e.g. https://leetcode.com/problems/two-sum/">
        </div>

        <div class="form-group">
          <label for="input-question-difficulty" class="form-label">Difficulty</label>
          <select id="input-question-difficulty" class="form-control">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div class="form-group">
          <label for="input-question-notes" class="form-label">Notes & Hints</label>
          <textarea id="input-question-notes" class="form-control" placeholder="Write down approach ideas, time/space complexity or core formulas..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-question">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-question">Save Question</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: View/Edit Notes -->
  <div id="modal-notes" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="notes-modal-title">Notes</h3>
        <button class="modal-close" id="close-modal-notes" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="form-notes">
        <input type="hidden" id="notes-question-id">
        <input type="hidden" id="notes-phase-id">
        <div class="form-group">
          <textarea id="textarea-notes" class="form-control" style="min-height: 180px;" placeholder="No notes yet. Add your formulas, algorithms, or pointers here..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-close-notes">Close</button>
          <button type="submit" class="btn btn-primary">Save Notes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
